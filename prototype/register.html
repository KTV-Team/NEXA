<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXA - Tạo tài khoản</title>
  <link rel="stylesheet" href="css/design-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/mobile-framework.css">
  <style>
    .auth-page-container {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 44px);
      padding: var(--space-lg);
      background-color: var(--color-canvas);
    }

    .auth-header-hero {
      margin: var(--space-xs) 0 var(--space-lg);
    }

    .auth-header-hero h1 {
      font-size: 26px;
      font-weight: 600;
      color: var(--color-ink);
      letter-spacing: -0.5px;
      margin-bottom: var(--space-xs);
    }

    .auth-header-hero p {
      font-size: 14px;
      color: var(--color-slate);
    }

    .pwd-requirements {
      background: var(--color-surface);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      margin-top: 6px;
      font-size: 11px;
      color: var(--color-slate);
    }

    .req-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }
    .req-item.valid {
      color: var(--color-success-accent);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <a href="index.html" class="prototype-helper-pill">📱 Prototype Portal</a>

  <div class="mobile-screen">
    <!-- Status Bar -->
    <div class="mobile-status-bar">
      <span>9:41</span>
      <div class="status-bar-notch"></div>
      <div class="status-bar-icons">
        <span>5G</span>
        <span>100%</span>
      </div>
    </div>

    <!-- App Header with Back Button -->
    <div class="app-header">
      <div class="app-header-left">
        <a href="onboarding.html" class="btn-icon" style="width:36px; height:36px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <span class="app-header-title">Đăng ký NEXA</span>
      </div>
      <div class="app-header-right">
        <span class="badge badge-tag-yellow">Free Tier</span>
      </div>
    </div>

    <div class="auth-page-container">
      <div class="auth-header-hero">
        <h1>Tạo tài khoản miễn phí</h1>
        <p>Bắt đầu hợp tác trực quan cùng đội ngũ với bảng vẽ không giới hạn.</p>
      </div>

      <!-- Registration Form -->
      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label" for="nameInput">Họ và tên của bạn</label>
          <input type="text" id="nameInput" class="text-input" placeholder="Ví dụ: Hoàng Minh Long" required value="Hoàng Minh Long">
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Email công việc</label>
          <input type="email" id="regEmail" class="text-input" placeholder="long.hoang@company.com" required value="long.hoang@company.com">
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Mật khẩu</label>
          <input type="password" id="regPassword" class="text-input" placeholder="Tối thiểu 8 ký tự" required value="NexaWorkspace2026!">
          
          <div class="pwd-requirements">
            <div class="req-item valid">✓ Tối thiểu 8 ký tự</div>
            <div class="req-item valid">✓ Ít nhất 1 chữ hoa và 1 chữ thường</div>
            <div class="req-item valid">✓ Chứa ít nhất 1 số</div>
          </div>
        </div>

        <div style="display:flex; align-items:flex-start; gap:8px; margin: var(--space-md) 0 var(--space-lg);">
          <input type="checkbox" id="termsCheck" checked required style="width:18px; height:18px; margin-top:2px; accent-color: var(--color-primary);">
          <label for="termsCheck" style="font-size:12px; line-height: 1.4; color: var(--color-slate); cursor:pointer;">
            Tôi đồng ý với <a href="#" style="color:var(--color-brand-blue);">Điều khoản sử dụng</a> và <a href="#" style="color:var(--color-brand-blue);">Chính sách quyền riêng tư</a> của NEXA.
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          <span>Tạo tài khoản ngay</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <div style="text-align: center; margin-top: auto; padding-top: var(--space-lg); font-size: 14px; color: var(--color-slate);">
        Đã có tài khoản? <a href="login.html" style="color: var(--color-brand-blue); font-weight: 600; text-decoration: none;">Đăng nhập</a>
      </div>
    </div>
  </div>

  <script src="js/mobile-app.js"></script>
  <script>
    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('nameInput').value;
      showToast(`Tạo tài khoản thành công cho ${name}!`);
      setTimeout(() => {
        window.location.href = 'home.html';
      }, 700);
    }
  </script>
</body>
</html>
