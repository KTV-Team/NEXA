<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXA - Đăng nhập</title>
  <link rel="stylesheet" href="css/design-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/mobile-framework.css">
  <style>
    .auth-page-container {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 44px);
      padding: var(--space-lg);
      background-color: var(--color-canvas);
    }

    .auth-header-hero {
      margin: var(--space-md) 0 var(--space-xl);
    }

    .auth-header-hero h1 {
      font-size: 28px;
      font-weight: 600;
      color: var(--color-ink);
      letter-spacing: -0.5px;
      margin-bottom: var(--space-xs);
    }

    .auth-header-hero p {
      font-size: 15px;
      color: var(--color-slate);
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-toggle-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--color-steel);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }

    .quick-account-picker {
      background-color: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: var(--space-md);
      margin-top: var(--space-xl);
      border: 1px dashed var(--color-hairline-strong);
    }

    .quick-account-picker p {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-slate);
      text-transform: uppercase;
      margin-bottom: var(--space-sm);
    }

    .quick-account-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #fff;
      border-radius: var(--radius-md);
      margin-bottom: 6px;
      cursor: pointer;
      border: 1px solid var(--color-hairline);
      font-size: 13px;
      transition: border-color 0.15s ease;
    }

    .quick-account-pill:hover, .quick-account-pill:active {
      border-color: var(--color-brand-blue);
    }
  </style>
</head>
<body>
  <a href="index.html" class="prototype-helper-pill">📱 Prototype Portal</a>

  <div class="mobile-screen">
    <!-- Status Bar -->
    <div class="mobile-status-bar">
      <span>9:41</span>
      <div class="status-bar-notch"></div>
      <div class="status-bar-icons">
        <span>5G</span>
        <span>100%</span>
      </div>
    </div>

    <!-- App Header with Back Button -->
    <div class="app-header">
      <div class="app-header-left">
        <a href="onboarding.html" class="btn-icon" style="width:36px; height:36px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <span class="app-header-title">Đăng nhập NEXA</span>
      </div>
      <div class="app-header-right">
        <span class="badge badge-tag-yellow">PROTOTYPE</span>
      </div>
    </div>

    <div class="auth-page-container">
      <div class="auth-header-hero">
        <h1>Chào mừng trở lại</h1>
        <p>Đăng nhập vào không gian làm việc số của nhóm bạn.</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="emailInput">Email công việc</label>
          <input type="email" id="emailInput" class="text-input" placeholder="alice@company.com" required value="alice@company.com">
        </div>

        <div class="form-group">
          <div class="form-label">
            <span>Mật khẩu</span>
            <a href="#" onclick="showToast('Link đặt lại mật khẩu đã được gửi'); return false;" style="color: var(--color-brand-blue); font-size: 12px; text-decoration: none;">Quên mật khẩu?</a>
          </div>
          <div class="password-wrapper">
            <input type="password" id="passwordInput" class="text-input" placeholder="••••••••" required value="Password123!">
            <button type="button" class="password-toggle-btn" onclick="togglePassword()">Hiện</button>
          </div>
        </div>

        <div style="display:flex; align-items:center; gap:8px; margin: var(--space-md) 0 var(--space-lg);">
          <input type="checkbox" id="rememberMe" checked style="width:18px; height:18px; accent-color: var(--color-primary);">
          <label for="rememberMe" style="font-size:13px; color: var(--color-charcoal); cursor:pointer;">Duy trì đăng nhập trên thiết bị này</label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          <span>Đăng nhập</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <!-- Quick Mock Login picker for testing -->
      <div class="quick-account-picker">
        <p>⚡ Tài khoản demo có sẵn (Click để chọn nhanh)</p>
        <div class="quick-account-pill" onclick="pickAccount('alice@company.com', 'Alice - Product Lead')">
          <div style="display:flex; align-items:center; gap:8px;">
            <div class="avatar" style="background:#4262ff; width:24px; height:24px; font-size:10px;">A</div>
            <div>
              <strong>Alice</strong> <span style="color:var(--color-slate); font-size:11px;">(Admin/Lead)</span>
            </div>
          </div>
          <span style="color:var(--color-brand-blue); font-size:12px; font-weight:600;">Chọn →</span>
        </div>
        <div class="quick-account-pill" onclick="pickAccount('bob@company.com', 'Bob - UX Engineer')">
          <div style="display:flex; align-items:center; gap:8px;">
            <div class="avatar" style="background:#0fbcb0; width:24px; height:24px; font-size:10px;">B</div>
            <div>
              <strong>Bob</strong> <span style="color:var(--color-slate); font-size:11px;">(Member)</span>
            </div>
          </div>
          <span style="color:var(--color-brand-blue); font-size:12px; font-weight:600;">Chọn →</span>
        </div>
      </div>

      <div style="text-align: center; margin-top: auto; padding-top: var(--space-xl); font-size: 14px; color: var(--color-slate);">
        Chưa có tài khoản NEXA? <a href="register.html" style="color: var(--color-brand-blue); font-weight: 600; text-decoration: none;">Đăng ký ngay</a>
      </div>
    </div>
  </div>

  <script src="js/mobile-app.js"></script>
  <script>
    function togglePassword() {
      const input = document.getElementById('passwordInput');
      const btn = event.target;
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Ẩn';
      } else {
        input.type = 'password';
        btn.textContent = 'Hiện';
      }
    }

    function pickAccount(email, name) {
      document.getElementById('emailInput').value = email;
      showToast(`Đã chọn tài khoản: ${name}`);
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value;
      showToast(`Đăng nhập thành công với ${email}... Đang chuyển trang`);
      setTimeout(() => {
        window.location.href = 'home.html';
      }, 700);
    }
  </script>
</body>
</html>
